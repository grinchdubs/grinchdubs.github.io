#-------------------------------
# GRNCH site sound
#
# Everything the generative drone does is set here. Sound only starts when a
# visitor presses "Sound" in the top bar. Edit, save, push: GitHub Pages
# rebuilds and the new settings are live. Any line you delete falls back to
# the default shown in its comment.

# Key and scale -----------------------------------------------------------

root: "C2"            # note + octave the drone sits on, e.g. C2, D#2, F1, A1 (default D2)

# Scale the bells and key changes use. Either a name below, or your own list of
# semitones above the root, e.g. [0, 1, 5, 7, 8].
#   minor_pentatonic  [0, 3, 5, 7, 10]   (default)
#   major_pentatonic  [0, 2, 4, 7, 9]
#   minor (aeolian)   [0, 2, 3, 5, 7, 8, 10]
#   dorian            [0, 2, 3, 5, 7, 9, 10]
#   phrygian          [0, 1, 3, 5, 7, 8, 10]
#   hirajoshi         [0, 2, 3, 7, 8]
#   whole_tone        [0, 2, 4, 6, 8, 10]
scale: hirajoshi

# Which scale step each fractal preset (1-4) moves the drone to. 0 = the root.
preset_steps: [0, 2, 3, 4]

tempo: 140            # BPM. Paces the bells and the pulse (default 122)

# Drone ------------------------------------------------------------------

drone:
  volume: 0.16        # 0-1 (default 0.16)
  wave: sawtooth      # sine | triangle | sawtooth | square (default sawtooth)
  detune: 0.66        # % between the two main voices; more = wider, more beating (default 0.66)
  sub: 0.9            # level of the sine an octave below, 0 = off (default 0.9)
  fifth: 0.18         # level of a fifth above, 0 = off (default 0.18)
  glide: 1.2          # seconds to slide to a new key when a preset changes (default 1.2)

# Filter: the slow "breathing" of the drone
filter:
  cutoff: 320         # Hz, centre of the low-pass (default 320)
  resonance: 5        # 0.5-20, higher = more whistle at the cutoff (default 5)
  sweep_depth: 190    # Hz the cutoff swings up and down (default 190)
  sweep_seconds: 32   # length of one full swing (default 32)

# Space ------------------------------------------------------------------

reverb:
  seconds: 3.4        # tail length (default 3.4)
  mix: 0.55           # 0-1 wet level (default 0.55)

sand: 0.18            # hiss when the mouse moves fast, 0 = off (default 0.18)

# Bells: soft pings in the scale -------------------------------------------

bells:
  on: true            # (default true)
  every_beats: [8, 20]  # a bell lands every 8 to 20 beats at the tempo above (default [8, 20])
  octave: 2           # octaves above the root (default 2)
  brightness: 0.35    # 0-1, how much metallic overtone (default 0.35)
  volume: 0.08        # (default 0.08)

# Pulse: an optional low techno thump on the beat ---------------------------

pulse:
  on: true           # (default false)
  volume: 0.35        # (default 0.35)
  every_beats: 1      # 1 = four on the floor, 2 = half time (default 1)
  pitch: 52           # Hz the thump starts at before it drops (default 52)
