---
layout: default
---
{% assign slug = page.name | remove: '.md' %}
{% assign proj = site.data.settings.projects | where: "url", slug | first %}
<article class="sheet{% if page.gallery %} sheet-wide{% endif %}">
  <header class="sheet-head">
    <h1 class="sheet-title">{{ page.title | default: proj.name | default: 'Work' }}</h1>
  </header>
  <div class="prose">{{ content }}</div>
</article>
